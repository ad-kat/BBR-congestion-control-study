[package]
name = "micewatch"
version = "0.1.0"
edition = "2024"
authors = ["Adri Katyayan"]
description = "Orchestrates Mininet BBR/CUBIC/Reno FCT experiments and generates HTML reports. Extends Cao et al. IMC 2019."

# Yes, these are real dependencies that do real things.
# No, we're not vendoring them. This is not a C project.
[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"          # error handling that doesn't make you cry
